version: '3.8'

services:
  # 本地 PostgreSQL 16 資料庫容器
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: always
    environment:
      POSTGRES_DB: hrms_db
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: LocalStrongPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Adminer 視覺化資料庫管理介面 (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: hrms_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
